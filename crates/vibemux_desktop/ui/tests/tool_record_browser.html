<!doctype html>
<meta charset="utf-8">
<title>DEMO file-card Find regression</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font: 14px system-ui; background: #faf9f5; }
  :root { --border: #d8d5cc; --surface_alt: #fff; --muted_text: #666; --font_code: monospace; }
  #shell { margin: 20px; width: 720px; height: 440px; overflow: hidden; border: 1px solid #999; }
  #header { height: 64px; padding: 18px; background: #f0ddd2; }
  #transcript { height: 280px; overflow: auto; border-top: 3px solid #999; }
  .spacer { height: 420px; }
  .tail { height: 400px; }
  .controls { margin: 20px; }
  button { padding: 8px; margin-right: 10px; }
  #result { white-space: pre-wrap; }
</style>
<section id="shell">
  <header id="header">DEMO conversation header</header>
  <div id="transcript" data-transcript-scroll><div class="spacer"></div><article id="card" data-transcript-body="tool"></article><div class="tail"></div></div>
  <footer>DEMO fixed composer</footer>
</section>
<section class="controls">
  <h1>DEMO file-card Find regression</h1>
  <button id="block" disabled>Reveal whole block</button>
  <button id="range" disabled>Reveal selected text</button>
  <pre id="result" role="status">Loading actual tool component…</pre>
</section>
<script type="module">
  import { mount, tick } from 'svelte';
  import ToolRecord from '../src/components/tool_record.svelte';
  import { transcript_text, find_text_matches, range_for_match } from '../src/lib/transcript_search.ts';
  import { reveal_transcript_element } from '../src/lib/transcript_scroll.ts';

  const marker = 'DEMO_DIFF_TARGET';
  const diff = Array.from({ length: 300 }, (_, index) => index === 270 ? `+${marker}` : `+synthetic diff line ${index}`).join('\n');
  const record = { format: 'vibemux_file_change_tool_record', schema_version: 1, call_id: 'file_demo', status: 'completed',
    changes: [{ path: 'demo.txt', kind: 'update', move_path: null, diff,
      diff_original_bytes: new TextEncoder().encode(diff).length, diff_truncated: false }], original_change_count: 1, changes_truncated: false };
  mount(ToolRecord, { target: document.querySelector('#card'), props: { text: JSON.stringify(record), complete: true, truncated: false } });
  await tick();
  const shell = document.querySelector('#shell'), transcript = document.querySelector('#transcript');
  const header = document.querySelector('#header'), card = document.querySelector('#card'), result = document.querySelector('#result');
  async function reveal(selected_range) {
    card.querySelector('details').open = false; shell.scrollTop = 0; transcript.scrollTop = 0;
    const before = header.getBoundingClientRect().top;
    const snapshot = transcript_text(card), matches = find_text_matches(snapshot.text, marker).matches;
    if (matches.length !== 1) throw new Error('expected one synthetic diff match');
    const range = range_for_match(snapshot.parts, matches[0]);
    if (!range) throw new Error('missing synthetic range');
    reveal_transcript_element(range.startContainer.parentElement, selected_range ? range : undefined);
    await new Promise(requestAnimationFrame);
    const target = range.getBoundingClientRect(), viewport = transcript.getBoundingClientRect();
    const body = range.startContainer.parentElement;
    result.textContent = JSON.stringify({
      mode: selected_range ? 'range' : 'block', details_open: card.querySelector('details').open,
      range_visible: target.top >= viewport.top + transcript.clientTop && target.bottom <= viewport.top + transcript.clientTop + transcript.clientHeight,
      header_preserved: Math.abs(header.getBoundingClientRect().top - before) < 0.5,
      outer_scroll: shell.scrollTop, transcript_scroll: transcript.scrollTop,
      document_scroll: document.scrollingElement.scrollTop,
      inner_vertical_clipping: body.scrollHeight > body.clientHeight + 1,
      target_top: target.top, target_bottom: target.bottom, viewport_top: viewport.top, viewport_bottom: viewport.bottom,
    }, null, 2);
  }
  for (const [id, selected] of [['block', false], ['range', true]]) {
    const button = document.querySelector(`#${id}`); button.disabled = false;
    button.addEventListener('click', () => reveal(selected).catch(error => { result.textContent = `fixture_error: ${error.message}`; }));
  }
  result.textContent = 'Ready · actual Svelte file card · synthetic data only';
</script>
