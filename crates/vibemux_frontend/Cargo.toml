[package]
name = "vibemux_frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "VibeMux unified frontend: read-only TUI debug view + egui-based central console GUI"

[lib]
# default `lib` target

[[bin]]
name = "vibemux_frontend_preview"
path = "src/bin/vibemux_frontend_preview.rs"
required-features = ["gui_screenshot"]

[[bin]]
name = "vibemux_frontend"
path = "src/bin/vibemux_frontend.rs"

[features]
# Forwards eframe's internal screenshot-test feature: with
# `EFRAME_SCREENSHOT_TO=<path>.png` set, the GUI renders a couple of
# frames and exits after saving the framebuffer to <path>. Used by
# local verification scripts only; never enabled in normal builds.
gui_screenshot = ["eframe/__screenshot", "dep:image"]

[[bin]]
name = "vibemux_frontend_tui"
path = "src/bin/vibemux_frontend_tui.rs"

[[bin]]
name = "vibemux_frontend_dump"
path = "src/bin/vibemux_frontend_dump.rs"

[[bin]]
name = "vibemux_dsh_tui"
path = "src/bin/vibemux_dsh_tui.rs"

[[bin]]
name = "vibemux_dashboard"
path = "src/bin/vibemux_dashboard.rs"

[dependencies]
crossterm.workspace = true
ratatui.workspace = true
tokio.workspace = true
egui.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
vibemux_probe = { path = "../vibemux_probe" }
vibemux_dsh = { path = "../vibemux_dsh" }
vibemux_harness = { path = "../vibemux_harness" }
vibemuxd = { path = "../vibemuxd" }
vibemux_types = { path = "../vibemux_types" }
time = { workspace = true, features = ["local-offset"] }
image = { version = "=0.25.9", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
# Native "Open folder" picker (Win32 dialog only). Default features are off:
# they add the Linux portal and Wayland stacks, which the GUI does not use;
# other platforms type or paste a path instead.
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
# Real-daemon feed tests use the Windows private-runtime path helper.
vibemuxd = { path = "../vibemuxd", features = ["test_helpers"] }
tempfile.workspace = true
