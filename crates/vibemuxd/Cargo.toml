[package]
name = "vibemuxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test_helpers = ["vibemux_harness/test_helpers", "vibemux_workflow/test_helpers"]

[[bin]]
name = "vibemux_registry_mock"
path = "../vibemux_plugin_supervisor/src/bin/vibemux_mock_plugin.rs"
required-features = ["test_helpers"]

[[bin]]
name = "vibemux_model_fixture"
path = "src/bin/vibemux_model_fixture.rs"
required-features = ["test_helpers"]

# Synthetic native vendor CLI for the harness dispatch tests (ADR 029).
[[bin]]
name = "vibemux_native_fixture"
path = "src/bin/vibemux_native_fixture.rs"
required-features = ["test_helpers"]

# Synthetic DSH SDK runtime for the DSH session tests (ADR 032). The source is
# shared with `vibemux_dsh` so the wire behaviour under test is the same code
# its own driver tests exercise.
[[bin]]
name = "vibemux_dsh_service_fixture"
path = "../vibemux_dsh/src/bin/vibemux_dsh_fixture.rs"
required-features = ["test_helpers"]

[[bin]]
name = "vibemux_worker_fixture"
path = "src/bin/vibemux_worker_fixture.rs"
required-features = ["test_helpers"]

# Synthetic decision peer for the decision routing tests (ADR 034).
[[bin]]
name = "vibemux_decision_fixture"
path = "src/bin/vibemux_decision_fixture.rs"
required-features = ["test_helpers"]

[[bin]]
name = "vibemux_broker_fixture"
path = "../vibemux_worker_tools/src/main.rs"
required-features = ["test_helpers"]

[dependencies]
tempfile.workspace = true
vibemux_worker_tools = { path = "../vibemux_worker_tools" }
reqwest.workspace = true
prost.workspace = true
async-trait.workspace = true
futures.workspace = true
time.workspace = true
vibemux_a2a = { path = "../vibemux_a2a" }
vibemux_model_peer = { path = "../vibemux_model_peer" }
vibemux_workspace = { path = "../vibemux_workspace" }
getrandom.workspace = true
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
vibemux_decision = { path = "../vibemux_decision" }
vibemux_events = { path = "../vibemux_events" }
vibemux_dsh = { path = "../vibemux_dsh" }
vibemux_harness = { path = "../vibemux_harness" }
vibemux_platform = { path = "../vibemux_platform" }
vibemux_probe = { path = "../vibemux_probe" }
vibemux_plugin_protocol = { path = "../vibemux_plugin_protocol" }
vibemux_plugin_supervisor = { path = "../vibemux_plugin_supervisor" }
vibemux_store = { path = "../vibemux_store" }
vibemux_types = { path = "../vibemux_types" }
vibemux_workflow = { path = "../vibemux_workflow" }

[dev-dependencies]
rusqlite.workspace = true
sysinfo.workspace = true
vibemux_platform = { path = "../vibemux_platform", features = ["test_helpers"] }
