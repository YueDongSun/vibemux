[package]
name = "vibemux_platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes `test_helpers` (the shared icacls ACL-loosening recipe) to other
# crates' test builds; vibemuxd/vibemux_cli dev-dependencies enable it.
test_helpers = []

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
base64.workspace = true
windows-sys.workspace = true

# Safe process-group lookup and signalling for process-tree containment
# (ADR 029 §6); no `unsafe` is needed on POSIX.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Darwin's killpg reports EPERM for an all-zombie group. Its safe libproc
# wrapper can prove that only the owned, unreaped leader remains.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[dev-dependencies]
tempfile.workspace = true
