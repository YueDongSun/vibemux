[package]
name = "vibemux_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test_helpers = []

[[bin]]
name = "vibemuxctl"
path = "src/main.rs"

[[bin]]
name = "vibemux_hang_fixture"
path = "src/bin/vibemux_hang_fixture.rs"
required-features = ["test_helpers"]

[[bin]]
name = "vibemux_exit_fixture"
path = "src/bin/vibemux_exit_fixture.rs"
required-features = ["test_helpers"]

[[bin]]
name = "vibemux_recovery_fixture"
path = "src/bin/vibemux_recovery_fixture.rs"
required-features = ["test_helpers"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
vibemux_harness = { path = "../vibemux_harness" }
vibemux_probe = { path = "../vibemux_probe" }
vibemuxd = { path = "../vibemuxd" }

[target.'cfg(windows)'.dependencies]
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
vibemux_platform = { path = "../vibemux_platform", features = ["test_helpers"] }
