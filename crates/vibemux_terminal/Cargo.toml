[package]
name = "vibemux_terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Contained first-party interactive terminal host and bounded VT model"

[[bin]]
name = "vibemux_terminal_host"
path = "src/bin/vibemux_terminal_host.rs"

[[bin]]
name = "vibemux_terminal_fixture"
path = "src/bin/vibemux_terminal_fixture.rs"

[dependencies]
alacritty_terminal = { version = "=0.25.0", default-features = false }
portable-pty = "=0.9.0"
home = "=0.5.11"
crossterm.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vibemux_platform = { path = "../vibemux_platform" }

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
tempfile.workspace = true
