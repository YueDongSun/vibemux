[workspace]
members = [
    "crates/vibemux_events",
    "crates/vibemux_types",
]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/YueDongSun/vibemux"

[workspace.dependencies]
proptest = "=1.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
time = { version = "=0.3.44", features = ["formatting", "parsing", "serde"] }
uuid = { version = "=1.25.0", features = ["serde", "v4"] }
