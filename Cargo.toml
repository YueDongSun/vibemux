[workspace]
members = [
    "crates/vibemux_a2a",
    "crates/vibemux_cli",
    "crates/vibemux_events",
    "crates/vibemux_frontend",
    "crates/vibemux_harness",
    "crates/vibemux_platform",
    "crates/vibemux_plugin_protocol",
    "crates/vibemux_model_peer",
    "crates/vibemux_plugin_supervisor",
    "crates/vibemux_probe",
    "crates/vibemux_store",
    "crates/vibemux_types",
    "crates/vibemux_workspace",
    "crates/vibemuxd",
]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/YueDongSun/vibemux"

[workspace.dependencies]
a2a = { package = "a2a-lf", version = "=0.3.0" }
a2a-client = { package = "a2a-client-lf", version = "=0.2.1", default-features = false }
a2a-server = { package = "a2a-server-lf", version = "=0.4.1", default-features = false }
a2a-pb = "=0.2.0"
a2a-grpc = { version = "=0.3.1", default-features = false }
tonic-types = "=0.14.5"
tonic = { version = "=0.14.5", default-features = false, features = ["transport"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
async-trait = "=0.1.92"
axum = "=0.8.7"
base64 = "=0.22.1"
crossterm = "=0.28.1"
egui = "=0.32.3"
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures = "=0.3.31"
getrandom = "=0.4.3"
httpdate = "=1.0.3"
proptest = "=1.11.0"
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "=0.13.1", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"] }
same-file = "=1.0.6"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
time = { version = "=0.3.44", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.47.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "=0.8.23"
url = "=2.5.8"
uuid = { version = "=1.25.0", features = ["serde", "v4"] }
