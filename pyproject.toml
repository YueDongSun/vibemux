[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vibemux"
version = "0.1.0a0"
description = "Windows-first, local-first collaboration environment for multiple coding-agent harnesses."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "VibeMux contributors" }]
dependencies = ["typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]

[project.scripts]
vibemux = "vibemux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vibemux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vibemux"]
