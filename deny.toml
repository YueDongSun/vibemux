[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Zlib",
]

# ece (via web-push) is MPL-2.0; accept that license for this crate only.
[[licenses.exceptions]]
crate = "ece"
allow = ["MPL-2.0"]

[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa is reached only via web-push -> jwt-simple -> superboring; VAPID signs with ES256 and VibeMux never uses RSA keys; no patched rsa release exists" },
]
