name: ci

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python scripts/check_public_artifacts.py
      - run: python scripts/smoke_test.py

  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The dual-track workflow tests run the TaskBoard Lite trusted suites
      # with `node --test`, which needs Node 22 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - run: npm ci
        working-directory: crates/vibemux_web/web
      - run: npm run typecheck
        working-directory: crates/vibemux_web/web
      - run: npm test
        working-directory: crates/vibemux_web/web
      - run: npm audit --audit-level=low
        working-directory: crates/vibemux_web/web
      - run: npm run build
        working-directory: crates/vibemux_web/web
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.92.0
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo install --locked cargo-nextest --version 0.9.98
      - run: cargo nextest run --locked --workspace --all-features

  dependency_policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: rustup default 1.92.0
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo deny check
      - run: cargo audit
